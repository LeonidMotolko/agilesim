name: backend

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", "db/demo/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "db/demo/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    # Throw-away database for the tests; the password exists only inside this CI job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agilesim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGILESIM_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/agilesim_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      # TODO(lock): switch to `uv sync --locked` once backend/uv.lock is committed.
      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Unit tests (pytest)
        run: uv run pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml

      - name: Export the schema as SQL (alembic offline mode)
        run: |
          mkdir -p reports
          AGILESIM_MIGRATION_DATABASE_URL=postgresql://offline@localhost/offline \
            uv run alembic -c alembic.ini upgrade head --sql > reports/schema.sql

      - name: docs/schema.sql is up to date
        run: |
          diff -u ../docs/schema.sql reports/schema.sql || {
            echo "::error::docs/schema.sql is stale. Regenerate it: cd backend && AGILESIM_MIGRATION_DATABASE_URL=postgresql://offline@localhost/offline uv run alembic -c alembic.ini upgrade head --sql > ../docs/schema.sql"
            exit 1
          }

      - name: db/demo/demo_data.sql is up to date
        run: |
          uv run python scripts/generate_demo_data.py | diff -u ../db/demo/demo_data.sql - || {
            echo "::error::db/demo/demo_data.sql is stale. Regenerate it: python backend/scripts/generate_demo_data.py > db/demo/demo_data.sql"
            exit 1
          }

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: backend/reports/
          if-no-files-found: ignore

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Audit runtime dependencies (pip-audit)
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
