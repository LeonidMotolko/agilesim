name: compose

on:
  push:
    branches: [main, dev]
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/compose.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build and start the stack (waits for healthchecks)
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Show service status
        run: docker compose ps

      - name: Backend answers directly
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health

      - name: Backend reaches the migrated database
        run: |
          body="$(curl --fail --silent --show-error http://127.0.0.1:8000/health/db)"
          echo "$body"
          test "$body" = '{"database":"ok"}'

      - name: The application role is limited and the schema is migrated
        run: |
          query() { docker compose exec -T db psql -U agilesim -d agilesim -At -c "$1"; }
          test "$(query "SELECT rolsuper FROM pg_roles WHERE rolname = 'agilesim_app'")" = f
          test "$(query "SELECT pg_has_role('agilesim_app', 'app_write', 'member')")" = t
          test "$(query "SELECT count(*) FROM scenario_stages")" = 5

      - name: Frontend serves the SPA
        run: curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<div id="root">'

      - name: Frontend proxies /api to the backend
        run: |
          body="$(curl --fail --silent --show-error http://127.0.0.1:8080/api/health)"
          echo "$body"
          test "$body" = '{"status":"ok"}'

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
