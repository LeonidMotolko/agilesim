server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/health -> http://backend:8000/health (the trailing slash strips the /api prefix)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundle files never change under the same name, so browsers may keep them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html. The page itself is never cached,
    # otherwise a browser keeps asking for the bundle files of the previous release.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
