[project]
name = "agilesim-backend"
version = "0.1.0"
description = "AgileSim backend: FastAPI API and Agile simulation rule engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "ty",
]

[tool.uv]
# Application, not a library: dependencies are installed, the project itself is not packaged.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=agilesim --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "PT",  # pytest style
    "S",   # bandit
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["agilesim"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # asserts are the point of tests
