[project]
name = "agilesim-backend"
version = "0.1.0"
description = "AgileSim backend: FastAPI API and Agile simulation rule engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "ty",
]

[tool.uv]
# Application, not a library: dependencies are installed, the project itself is not packaged.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=agilesim --cov-report=term-missing"
markers = ["db: needs PostgreSQL (set AGILESIM_TEST_DATABASE_URL); skipped otherwise"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "PT",  # pytest style
    "S",   # bandit
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["agilesim"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # asserts and fake credentials are the point of tests
"agilesim/db/migrations/versions/*" = ["E501"] # SQL text in migrations
"scripts/*" = ["S105", "S311", "S608"] # seeded demo data generator: no secrets, no user input
